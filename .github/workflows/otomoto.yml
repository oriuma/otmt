name: Otomoto Telegram Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

# Prevent concurrent state updates — only one run at a time
concurrency:
  group: otomoto-scraper-state
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PRICE_PLN: "10000"
          MAX_PAGES: "5"
          TELEGRAM_SLEEP_SECONDS: "0.7"
          STATE_FILE: "data/sent_ids_otomoto.json"
        run: |
          python -m src.main

      - name: Commit updated state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Working on branch: $BRANCH"

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git add data/sent_ids_otomoto.json

          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi

          git commit -m "chore: update Otomoto sent_ids state"

          max_attempts=5
          for attempt in $(seq 1 $max_attempts); do
            echo "Attempt $attempt/$max_attempts: fetch+rebase then push"
            git fetch origin "$BRANCH"

            if git rebase "origin/$BRANCH"; then
              if git push origin "$BRANCH"; then
                echo "Push successful on attempt $attempt"
                break
              else
                echo "Push failed on attempt $attempt"
              fi
            else
              echo "Rebase failed on attempt $attempt, aborting"
              git rebase --abort || true
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Failed to push after $max_attempts attempts"
              exit 1
            fi

            sleep $((2 ** attempt))
          done
